server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: smart-learning-backend

  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_learning_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms

# MyBatis-Plus 配置
mybatis-plus:
  type-aliases-package: com.smartlearning.backend.module
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

knife4j:
  enable: true
  openapi:
    title: 智慧学习辅助系统接口文档
    description: 基于 AI Agent 的智慧学习辅助系统 API
    version: v1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.smartlearning.backend.module
ai:
  service:
    base-url: http://127.0.0.1:8000
    connect-timeout: 5000
    timeout: 300000

security:
  jwt:
    secret: ${JWT_SECRET:change-this-local-development-secret-key-2026}
    access-expire-ms: ${JWT_ACCESS_EXPIRE_MS:86400000}
    refresh-expire-ms: ${JWT_REFRESH_EXPIRE_MS:604800000}
